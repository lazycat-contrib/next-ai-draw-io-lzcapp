version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/next-ai-draw-io.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: next-ai-draw-io

build:
  run_buildscript: false

images:
  - id: next-ai-draw-io
    target: service
    service: next-ai-draw-io
    source: ghcr.io/dayuanjiang/next-ai-draw-io
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Next AI Draw.io
    summary: "用自然语言创建、修改、美化 draw.io 图表"
